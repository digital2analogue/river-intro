version: 2
updates:
  # Weekly npm bumps, grouped into a single PR to keep the noise down.
  # Security advisories still arrive as separate, immediate PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns:
          - "*"
        # Majors stay OUT of the group. Repo policy is that major bumps are
        # taken by hand, and with `patterns: ["*"]` alone that policy froze
        # everything behind the first unapproved one: PR #26 carried the
        # parsimony 0.7.0 token bump (including a WCAG fix) but also vitest
        # 3->4, so it sat from 2026-08-17 until #30 unpicked it by hand, and
        # this site shipped 0.6.1 tokens the whole time (#27).
        #
        # With this, minors and patches still arrive as one quiet weekly PR
        # that auto-merges, and each major arrives on its own — declinable
        # without taking the safe half hostage. Same shape decisioning-table
        # adopted after its typescript-7 incident.
        update-types:
          - minor
          - patch
        # ...with one exception, because "one major per PR" is wrong for
        # packages that only work in lockstep. `@vitest/ui` declares an EXACT
        # peer on its matching `vitest`, so splitting the pair across two PRs
        # makes each one uninstallable — `npm install` fails ERESOLVE before
        # anything runs. That is what #35 and #36 are: the 4.1.11 -> 5.0.0 bump
        # arriving as two halves, each conflicting with the half still on main.
        #
        # Vercel reports both green, which is misleading rather than reassuring:
        # this project deploys four static files and never runs an install, so
        # the deploy cannot see the conflict. CI is where it shows.
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
      # The vitest family, kept whole. No `update-types` filter, so majors ride
      # in this group too and the pair moves together in one installable PR.
      # Majors are still taken by hand — dependabot-automerge skips any npm PR
      # whose update-type is semver-major, and a group reports its highest
      # change. This only ensures the PR can resolve, so the tests get to say
      # whether vitest 5 works. (When vitest 3->4 finally ran here, it was a
      # non-event: 8/8 passed unchanged.)
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # Keep the actions used in .github/workflows fresh too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
